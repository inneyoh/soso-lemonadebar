<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Soso's Lemon Water Diner</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Soso's Diner">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fff3dc">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🍋%3C/text%3E%3C/svg%3E">
<style>
:root{
  --cocoa:#8a5f4a; --cocoa-soft:#b58a70;
  --butter:#ffe9a6; --cream:#fff6e4; --milk:#fffdf7;
  --peach:#ffd9c2; --rose:#ffd0d6; --mint:#d6ecc4; --sky:#cfe8f8; --lav:#e5dcf8;
  --lift:0 10px 20px rgba(190,140,100,.2);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;height:100%;overflow:hidden;overscroll-behavior:none;
  touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  color:var(--cocoa);
  font-family:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN","Arial Rounded MT Bold","Nunito",system-ui,sans-serif;
  background:
    radial-gradient(circle at 12% 6%,#ffe6ec 0,transparent 42%),
    radial-gradient(circle at 85% 8%,#fff0b8 0,transparent 36%),
    radial-gradient(circle at 92% 94%,#e4f2d3 0,transparent 42%),
    #fff6e4;
}
button{font:inherit;color:inherit;cursor:pointer;border:none}
#app{position:fixed;inset:0;display:flex;justify-content:center;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.wrap{width:100%;max-width:480px;height:100%;display:flex;flex-direction:column;gap:10px;padding:8px 12px 12px}

/* HUD */
.hud{display:flex;gap:6px;align-items:center}
.chip{background:linear-gradient(#fffefa,#fff0da);border-radius:18px;padding:5px 11px;font-weight:800;font-size:15px;
  display:flex;align-items:center;gap:4px;
  box-shadow:0 6px 12px rgba(190,140,100,.2),inset 0 2px 2px #fff,inset 0 -3px 6px rgba(235,195,155,.4)}
#hearts{color:#ff8fa3;letter-spacing:2px;font-size:17px;text-shadow:0 1px 0 #fff}
.hud .score{margin-left:auto}
.mini{width:37px;height:36px;justify-content:center;padding:0}
.mini:active{transform:translateY(2px)}
.bump{animation:bump .25s}
@keyframes bump{50%{transform:scale(1.2)}}

/* Order screen */
.order{background:linear-gradient(#fffefb,#fff3df);border-radius:26px;overflow:hidden;
  box-shadow:var(--lift),inset 0 2px 2px #fff,0 0 0 3px rgba(255,255,255,.9)}
.ord-head{display:flex;align-items:center;gap:8px;padding:7px 14px;background:linear-gradient(#f0e8fc,#e1d7f6);font-weight:800;font-size:13px;
  box-shadow:inset 0 -2px 4px rgba(150,120,200,.18)}
.tbar{flex:1;height:13px;border-radius:9px;background:#fff6e8;overflow:hidden;box-shadow:inset 0 2px 4px rgba(170,130,100,.3)}
.tbar i{display:block;height:100%;width:100%;border-radius:9px;background:linear-gradient(#dff3c5,#a9d76f);box-shadow:inset 0 2px 2px rgba(255,255,255,.7);transition:background .2s}
.tbar i.low{background:linear-gradient(#ffc9d1,#ff93a5)}
.ord-body{display:flex;gap:10px;align-items:center;padding:9px 14px 12px;min-height:98px}
.rows{flex:1;display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.row label{font-size:12px;font-weight:800;opacity:.65}
.row b{background:linear-gradient(#fff4c2,#ffdf86);border-radius:16px;padding:4px 14px;font-size:20px;white-space:nowrap;color:#7a5240;
  box-shadow:inset 0 2px 2px rgba(255,255,255,.95),inset 0 -3px 5px rgba(230,175,70,.4),0 4px 8px rgba(200,150,80,.22)}
#gauge{width:62px;height:82px;flex:none;filter:drop-shadow(0 4px 4px rgba(170,120,90,.25))}
.order.flash{animation:flash .45s}
@keyframes flash{0%{transform:scale(.97)}60%{transform:scale(1.015)}100%{transform:scale(1)}}

/* Scene */
.scene{position:relative;flex:1;min-height:170px;border-radius:30px;overflow:hidden;background:#fff3dc;
  box-shadow:0 12px 24px rgba(190,140,100,.28),0 0 0 4px #fff,0 0 0 5px rgba(200,160,130,.22)}
#scene{width:100%;height:100%;display:block}
.soso{transform-box:fill-box;transform-origin:50% 100%;animation:bob 2s ease-in-out infinite}
.soso.hop{animation:hop .5s ease-out}
.soso.shake{animation:shake .45s}
@keyframes bob{50%{transform:scale(1.015,.985)}}
@keyframes hop{0%{transform:translateY(0)}35%{transform:translateY(-14px) scale(.98,1.04)}100%{transform:translateY(0)}}
@keyframes shake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.mb{opacity:.55;transition:opacity .1s}
.mb.lit{opacity:1;filter:drop-shadow(0 0 5px #fff)}
#popLayer{position:absolute;inset:0;pointer-events:none}
.pop{position:absolute;left:42%;top:30%;font-weight:900;font-size:23px;padding:6px 16px;border-radius:20px;background:#fffdf7;
  white-space:nowrap;animation:pop 1.15s ease-out forwards;
  box-shadow:0 8px 16px rgba(190,140,100,.3),inset 0 2px 2px #fff,inset 0 -3px 5px rgba(230,190,150,.35)}
.pop.good{background:linear-gradient(#eaf7d8,#cbe8ab)}
.pop.bad{background:linear-gradient(#ffe6ea,#ffbfca)}
.pop.info{background:linear-gradient(#f3eefc,#ddd2f4)}
@keyframes pop{
  0%{opacity:0;transform:translate(-50%,10px) scale(.6)}
  15%{opacity:1;transform:translate(-50%,0) scale(1.1)}
  70%{opacity:1;transform:translate(-50%,-14px) scale(1)}
  100%{opacity:0;transform:translate(-50%,-30px) scale(1)}}

/* Momo level-up visitor */
.momo{position:absolute;right:-2px;top:8px;display:flex;align-items:flex-start;transform:translateX(125%);pointer-events:none;z-index:4}
.momo svg{width:98px;height:98px;flex:none;filter:drop-shadow(0 6px 6px rgba(150,100,70,.25))}
.momo .bubble{position:relative;margin:6px 0 0;padding:7px 11px;border-radius:18px;background:#fff;text-align:center;
  font-weight:900;font-size:15px;line-height:1.2;color:var(--cocoa);box-shadow:0 8px 14px rgba(190,140,100,.28),inset 0 -3px 5px rgba(240,205,170,.4)}
.momo .bubble small{display:block;font-size:11px;font-weight:800;opacity:.65}
.momo .bubble::after{content:"";position:absolute;right:-6px;top:18px;border:7px solid transparent;border-left:8px solid #fff;border-right:0}
.momo.show{animation:momoIn 2.7s ease forwards}
@keyframes momoIn{0%{transform:translateX(125%)}12%{transform:translateX(-7%)}18%{transform:translateX(0)}84%{transform:translateX(0)}100%{transform:translateX(125%)}}
.wave{transform-box:fill-box;transform-origin:50% 100%;animation:wave .45s ease-in-out infinite alternate}
@keyframes wave{from{transform:rotate(-14deg)}to{transform:rotate(16deg)}}

/* Buttons: soft pillows */
.controls{display:grid;grid-template-columns:1fr 1fr 1.15fr;gap:11px}
.btn{height:clamp(76px,12vh,100px);border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-weight:900;letter-spacing:.5px;transition:transform .06s,box-shadow .06s;touch-action:none;-webkit-user-select:none;user-select:none;
  color:#7a5240;border:2px solid rgba(255,255,255,.75)}
.btn .em{font-size:28px;line-height:1.05;filter:drop-shadow(0 2px 2px rgba(120,80,50,.2))}
.btn .lb{font-size:16px;text-shadow:0 1px 0 rgba(255,255,255,.7)}
.btn .sub{font-size:11px;font-weight:700;opacity:.6}
.btn.ice{background:linear-gradient(#eaf7ff,#b7dbf4);
  box-shadow:0 7px 0 #8dbbdd,0 14px 16px rgba(110,150,185,.35),inset 0 3px 3px rgba(255,255,255,.95),inset 0 -5px 8px rgba(120,170,215,.3)}
.btn.warm{background:linear-gradient(#fff0e0,#ffcfa6);
  box-shadow:0 7px 0 #e8a876,0 14px 16px rgba(200,140,90,.35),inset 0 3px 3px rgba(255,255,255,.95),inset 0 -5px 8px rgba(240,160,100,.3)}
.btn.serve{background:linear-gradient(#f0fbe0,#c3e59b);
  box-shadow:0 7px 0 #98c068,0 14px 16px rgba(130,170,90,.35),inset 0 3px 3px rgba(255,255,255,.95),inset 0 -5px 8px rgba(140,190,90,.3)}
.btn.down{transform:translateY(6px)}
.btn.ice.down{box-shadow:0 1px 0 #8dbbdd,0 4px 6px rgba(110,150,185,.35),inset 0 3px 6px rgba(120,170,215,.4)}
.btn.warm.down{box-shadow:0 1px 0 #e8a876,0 4px 6px rgba(200,140,90,.35),inset 0 3px 6px rgba(240,160,100,.4)}
.btn.serve.down{box-shadow:0 1px 0 #98c068,0 4px 6px rgba(130,170,90,.35),inset 0 3px 6px rgba(140,190,90,.4)}

/* Overlay */
.overlay{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:20px;
  background:rgba(255,246,228,.8);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.overlay.hidden{display:none}
.card{background:linear-gradient(#fffefb,#fff2dd);border-radius:34px;padding:16px 18px 20px;max-width:380px;width:100%;text-align:center;
  box-shadow:0 18px 34px rgba(190,140,100,.3),inset 0 2px 2px #fff,0 0 0 4px rgba(255,255,255,.9);max-height:100%;overflow:auto}
.card h1{margin:4px 0 2px;font-size:25px;line-height:1.15}
.card p{margin:4px 0;font-size:14px;line-height:1.45}
.card ul{list-style:none;margin:10px 0;padding:11px 14px;text-align:left;font-size:13.5px;line-height:1.5;
  background:linear-gradient(#fff9e0,#fff0c2);border-radius:20px;box-shadow:inset 0 2px 5px rgba(220,170,90,.25)}
.card li{margin:4px 0}
.go{margin-top:8px;background:linear-gradient(#f0fbe0,#c3e59b);border-radius:24px;padding:11px 30px;font-weight:900;font-size:19px;color:#6d5a3a;
  border:2px solid rgba(255,255,255,.75);
  box-shadow:0 6px 0 #98c068,0 12px 14px rgba(130,170,90,.3),inset 0 3px 3px rgba(255,255,255,.95)}
.go:active{transform:translateY(5px);box-shadow:0 1px 0 #98c068}
.big-soso{width:150px;height:150px;margin:0 auto;display:block;filter:drop-shadow(0 8px 8px rgba(150,100,70,.2))}
.pause-art{width:210px;height:auto;margin:0 auto;display:block;filter:drop-shadow(0 8px 8px rgba(150,100,70,.18))}
.puff{animation:puff 2.6s ease-in-out infinite}
@keyframes puff{0%,100%{transform:translateY(2px)}50%{transform:translateY(-2px)}}
.stat{display:flex;justify-content:space-between;font-weight:800;font-size:16px;padding:4px 10px}
.small{font-size:12px;opacity:.7}
@media (prefers-reduced-motion:reduce){.soso,.wave{animation:none}}
</style>
</head>

<!-- shared soft-3D gradients (referenced by every svg below) -->

 </defs>
</svg>

  <div class="controls">

<script>
(()=>{
'use strict';
const NS='http://www.w3.org/2000/svg';
const $=id=>document.getElementById(id);
const OUT='#b4836a';          /* soft cocoa outline */
const EYE='#5a3524';
const COLD='#b9e6ff', WARM='#ffe46b';

/* ---------- Soso & Momo art (follows the character sheet) ---------- */
const CH='#7b4a32';   /* character outline colour from the sheet */
const SOSO_HEAD='M7 56 C7 20 32 6 60 6 C88 6 113 20 113 56 C113 74 92 84 60 84 C28 84 7 74 7 56Z';
const MOMO_HEAD='M13 52 C13 18 34 2 60 2 C86 2 107 18 107 52 C107 72 88 84 60 84 C32 84 13 72 13 52Z';
function eyeDark(cx,cy){
  return `<ellipse cx="${cx}" cy="${cy}" rx="6.3" ry="10" fill="${EYE}"/><circle cx="${cx-2}" cy="${cy-4.8}" r="2.7" fill="#fff"/>`;
}
/* Soso's right eye: the upper half of the thread colour has faded (see "Eye Detail") */
function eyeFaded(cx,cy){
  const l=cx-6.3, r=cx+6.3;
  return `<ellipse cx="${cx}" cy="${cy}" rx="6.3" ry="10" fill="#fff2df"/>

function lerpHex(a,b,t){
  const pa=[1,3,5].map(i=>parseInt(a.substr(i,2),16)), pb=[1,3,5].map(i=>parseInt(b.substr(i,2),16));
  return '#'+pa.map((v,i)=>Math.round(v+(pb[i]-v)*t).toString(16).padStart(2,'0')).join('');
}
function poly(f0,f1,cx,yb,yt,hb,ht){
  const h=f=>hb+(ht-hb)*f, y=f=>yb+(yt-yb)*f;
  return `${cx-h(f0)},${y(f0)} ${cx-h(f1)},${y(f1)} ${cx+h(f1)},${y(f1)} ${cx+h(f0)},${y(f0)}`;
}

let lastKey='';
function genOrder(level){
  const temps = level<1 ? {cold:['Cold'],room:['Warm']}
              : level<2 ? {cold:['Cold','Iced'],room:['Warm','Not Cold']}
              :           {cold:['Cold','Iced'],room:['Warm','Not Cold','Room temperature']};
  const amts = level<1 ? ['normal','half'] : level<3 ? ['normal','half','bit','more'] : ['normal','half','bit','more','empty'];
  let o,key,tries=0;
  do{
    const t=Math.random()<.5?'cold':'room', a=pick(amts);
    o={temp:t,tempLabel:pick(temps[t]),amt:a};
    key=t+a; tries++;
  }while(key===lastKey&&tries<6);
  lastKey=key;
  return o;
}

let ac=null,noiseGain=null,noiseFilt=null;
function initAudio(){
  try{
    if(!ac){
      const AC=window.AudioContext||window.webkitAudioContext; if(!AC)return;
      ac=new AC();
      const len=ac.sampleRate*2, buf=ac.createBuffer(1,len,ac.sampleRate), d=buf.getChannelData(0);
      for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
      const src=ac.createBufferSource(); src.buffer=buf; src.loop=true;
      noiseFilt=ac.createBiquadFilter(); noiseFilt.type='bandpass'; noiseFilt.frequency.value=1000; noiseFilt.Q.value=.8;
      noiseGain=ac.createGain(); noiseGain.gain.value=0;
      src.connect(noiseFilt); noiseFilt.connect(noiseGain); noiseGain.connect(ac.destination); src.start();
    }
    if(ac.state==='suspended')ac.resume();
  }catch(e){}
}
function tone(f,dur,type,vol,f2,delay){
  if(!ac||muted)return;
  try{
    const t=ac.currentTime+(delay||0), o=ac.createOscillator(), g=ac.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(f,t); if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
    g.gain.setValueAtTime(vol||.15,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+dur+.02);
  }catch(e){}
}
let pouringSnd=false, pourSndType=null;
function pourSound(on,type){
  if(!ac||!noiseGain)return;
  noiseGain.gain.setTargetAtTime((on&&!muted)?.13:0,ac.currentTime,.03);
  if(on)noiseFilt.frequency.setTargetAtTime(type==='ice'?1500:800,ac.currentTime,.05);
  pouringSnd=on; pourSndType=on?type:null;
}

/* ---------- game flow ---------- */
function startOrder(c){
  G.orderNo++; cur=c;
  c.order=genOrder(G.level);
  c.limit=c.t=Math.max(7,15-G.level*1.3);
  showOrder(c.order); paintBand(c); sfx.next();
}
function levelFor(n){return Math.min(6,Math.floor(n/4));}

function judge(c){
  const o=c.order,a=AMTS[o.amt],tot=c.cold+c.warm,cf=tot>0?c.cold/tot:.5;
  let ok=true,msg='';
  if(o.amt==='empty'){
    if(c.level>a.hi){ok=false;msg='It should be empty!';}
  }else{
    if(c.level<a.lo-1e-4){ok=false;msg=c.level<.03?'Forgot to pour!':'Too little!';}
    else if(c.level>a.hi+1e-4){ok=false;msg='Too much!';}
    if(ok){
      if(o.temp==='cold'&&cf<.75){ok=false;msg='Not cold enough!';}
      else if(o.temp==='room'&&cf>.25){ok=false;msg='Too cold!';}
    }
  }
  let perfect=false;
  if(ok){
    if(o.amt==='empty')perfect=c.level===0;
    else{
      const mid=o.amt==='more'?.98:(a.lo+a.hi)/2;
      const tempPure=o.temp==='cold'?cf>=.95:cf<=.05;
      perfect=Math.abs(c.level-mid)<=.05&&tempPure;
    }
  }
  return {ok,msg,perfect};
}
function finish(c,ok,msg,perfect){
  if(G.state!=='play'||c.state!=='ready')return;
  c.state='leaving'; c.band.innerHTML=''; cur=null;
  sfx.bell();
  if(ok){
    G.combo++; G.served++;
    G.score+=100+Math.ceil(Math.max(0,c.t))*8+G.combo*15+(perfect?60:0);
    pop(perfect?'Perfect! ✨':pick(['Yum!','Fresh!','Nice pour!','Refreshing!']),'good');
    setTimeout(perfect?sfx.perfect:sfx.good,120);
    setExpr('happy',1.1); sosoAnim('hop');
    const nl=levelFor(G.served);
    if(nl>G.level){G.level=nl;setTimeout(()=>{if(G.state==='play')momoPop(G.level+1);},650);}
    bump('score');
  }else{
    G.lives--; G.combo=0;
    pop(msg,'bad'); setTimeout(sfx.bad,150);
    setExpr('ouch',1.1); sosoAnim('shake');
    bump('hearts');
  }
  updateHUD();
  if(G.lives<=0){
    G.state='over'; pourSound(false);
    setTimeout(showOver,1000);
  }else spawnCup();
}
function doServe(){
  if(G.state!=='play'||G.paused||!cur||cur.state!=='ready')return;
  const r=judge(cur); finish(cur,r.ok,r.msg,r.perfect);
}
function setExpr(n,t){exprName=n;exprT=t;}

function update(dt){
  let moving=false;
  for(let i=cups.length-1;i>=0;i--){
    const c=cups[i];
    if(c.state==='arriving'){
      const v=Math.min(SPEED,(STATION_X-c.x)*8+30); c.x+=v*dt; moving=true;
      if(STATION_X-c.x<.6){c.x=STATION_X;c.state='ready';startOrder(c);}
    }else if(c.state==='leaving'){
      c.x+=SPEED*dt; moving=true;
      if(c.x>450){c.g.remove();cups.splice(i,1);}
    }
  }
  if(moving)beltOff=(beltOff+SPEED*dt)%24;
  const c=cur;
  if(c&&c.state==='ready'){
    if(pourType&&c.level<1){
      const d=Math.min(1-c.level,POUR*dt); c.level+=d;
      if(pourType==='ice')c.cold+=d;else c.warm+=d;
      paintCup(c);
    }
    c.t-=dt;
    $('tfill').style.width=Math.max(0,c.t/c.limit*100)+'%';
    $('tfill').classList.toggle('low',c.t/c.limit<.3);
    if(c.t<=0){finish(c,false,'Too slow!');}
  }
  if(exprT>0)exprT-=dt;
  const pouring=!!(cur&&cur.state==='ready'&&pourType&&cur.level<1);
  const panic=cur&&cur.state==='ready'&&cur.t<4;
  setSoso(exprT>0?exprName:(panic?'panic':'idle'),pouring?'reach':'rest');
  if(pouring!==pouringSnd||(pouring&&pourSndType!==pourType))pourSound(pouring,pourType);
}

function render(t){
  for(const c of cups)c.g.setAttribute('transform',`translate(${c.x.toFixed(1)},${CUP_Y})`);
  beltPat.setAttribute('x',beltOff.toFixed(1));
  const c=cur, pouring=G.state==='play'&&c&&c.state==='ready'&&pourType&&c.level<1;
  if(pouring){
    const surf=258-54*c.level, h=Math.max(0,surf-186);
    stream.style.display='';
    strm.setAttribute('height',h.toFixed(1));
    strm.setAttribute('fill',pourType==='ice'?COLD:WARM);
    strm.setAttribute('stroke',OUT); strm.setAttribute('stroke-width','1.3');
    strmHi.setAttribute('y2',(186+h).toFixed(1));
    strmHi.setAttribute('stroke-dashoffset',(-t*90).toFixed(1));
  }else stream.style.display='none';
  $('m1').classList.toggle('lit',!!pouring&&pourType==='ice');
  $('m2').classList.toggle('lit',!!pouring&&pourType==='warm');
  $('m3').classList.toggle('lit',bServe.classList.contains('down'));
}

let last=0;
function loop(ts){
  const dt=Math.min(.05,(ts-last)/1000||0); last=ts;
  if(G.state==='play'&&!G.paused)update(dt);
  else if(pouringSnd)pourSound(false);
  render(ts/1000);
  requestAnimationFrame(loop);
}

/* ---------- overlays ---------- */
const overlay=$('overlay');
const bigSoso=(e)=>`<svg class="big-soso" viewBox="0 0 120 130"><ellipse cx="60" cy="124" rx="42" ry="5" fill="url(#gGround)"/>${sosoMarkup(e,'rest')}</svg>`;
const HOWTO=`<ul>
  <li>🧊 <b>Hold ICED</b> for cold water, ☀️ <b>hold WARM</b> for room-temperature water.</li>
  <li>Fill the cup to the dashed box, then tap 🛎️ <b>SERVE</b>.</li>
  <li><b>Cold / Iced</b> → ICED. <b>Not Cold / Warm / Room temperature</b> → WARM.</li>
  <li>Wrong order or too slow costs a ♥. Keep a combo for bonus points!</li>
 </ul>`;
function hideOverlay(){overlay.classList.add('hidden');overlay.innerHTML='';}
function showTitle(){
  overlay.innerHTML=`<div class="card">${bigSoso('idle')}<h1>Soso's Lemon Water Diner</h1><p>Pour every glass just the way it was ordered.</p>${HOWTO}
   <button class="go" id="goStart">Start</button>
   <p class="small">Best: ${G.best} &nbsp;|&nbsp; Keys: 1 / 2 / 3 or ← ↓ → &nbsp;|&nbsp; P = pause</p>
   <p class="small">iPhone tip: Share → Add to Home Screen to play fullscreen.</p></div>`;
  overlay.classList.remove('hidden');
  $('goStart').addEventListener('click',()=>{initAudio();startGame();});
}
function showHelp(){
  overlay.innerHTML=`<div class="card"><h1>How to play</h1>${HOWTO}<button class="go" id="goBack">Back to the diner</button></div>`;
  overlay.classList.remove('hidden');
  $('goBack').addEventListener('click',()=>{hideOverlay();G.paused=false;});
}
function showPause(){
  overlay.innerHTML=`<div class="card">${pauseArt()}<h1>Paused</h1><p>Phew… take a little break.</p><button class="go" id="goBack">Resume</button></div>`;
  overlay.classList.remove('hidden');
  $('goBack').addEventListener('click',()=>{hideOverlay();G.paused=false;});
}
function showOver(){
  let newBest=false;
  if(G.score>G.best){G.best=G.score;newBest=true;try{localStorage.setItem('soso-best',String(G.best));}catch(e){}}
  overlay.innerHTML=`<div class="card">${bigSoso('ouch')}<h1>Shift over!</h1>
   <div class="stat"><span>Score</span><span>${G.score}</span></div>
   <div class="stat"><span>Cups served</span><span>${G.served}</span></div>
   <div class="stat"><span>Best</span><span>${G.best}</span></div>
   ${newBest?'<p><b>New best score! ✨</b></p>':''}
   <button class="go" id="goAgain">Play again</button></div>`;
  overlay.classList.remove('hidden');
  $('goAgain').addEventListener('click',()=>{startGame();});
}
function startGame(){
  Object.assign(G,{state:'play',score:0,lives:3,combo:0,served:0,level:0,orderNo:0,paused:false});
  cups.forEach(c=>c.g.remove()); cups=[]; cur=null; holds=[]; pourType=null; exprT=0; lastKey='';
  $('momo').classList.remove('show');
  hideOverlay(); updateHUD(); clearOrder(); spawnCup();
}

/* ---------- boot ---------- */
setSoso('idle'); updateHUD(); showTitle();
requestAnimationFrame(loop);
})();
</script>
